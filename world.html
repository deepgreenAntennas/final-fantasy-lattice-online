<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lattice World</title>
<style>
body { margin:0; background:black; color:white; }
canvas { width:100%; height:100vh; display:block; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const renderer = new THREE.WebGLRenderer({canvas: c});
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 5;

const geo = new THREE.PlaneGeometry(10,10,100,100);

const mat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }},
  vertexShader: `
    uniform float time;
    void main(){
      vec3 pos = position;
      pos.z += sin(pos.x*3.0 + time)*0.3;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader: `
    uniform float time;
    void main(){
      vec3 col = vec3(
        0.5+0.5*sin(time),
        0.5+0.5*sin(time+2.0),
        1.0
      );
      gl_FragColor = vec4(col,1.0);
    }
  `
});

const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

function animate(){
  requestAnimationFrame(animate);
  mat.uniforms.time.value += 0.02;
  renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
