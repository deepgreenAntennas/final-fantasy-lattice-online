<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lattice Archive</title>
<style>
body { font-family:sans-serif; background:#020617; color:white; padding:20px; }
.node { background:#0f172a; padding:10px; margin:10px 0; border-radius:10px; }
</style>
</head>
<body>

<h2>📡 Lattice Archive</h2>
<div id="list"></div>

<script>
const archive = JSON.parse(localStorage.getItem("archive") || "[]");

list.innerHTML = archive.reverse().map(n=>`
  <div class="node">
    <b>${n.title}</b><br/>
    ${n.content}
  </div>
`).join("");
</script>

</body>
</html>
