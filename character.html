<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altima Render</title>

<style>
body {
  margin:0;
  background:black;
  overflow:hidden;
}
canvas {
  display:block;
}
.ui {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
}
button {
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#7c3aed;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="ui">
  <button onclick="spin()">Rotate</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ================= SCENE =================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ================= LIGHTING =================
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(2,2,5);
scene.add(light);

// ================= CHARACTER CORE =================
const group = new THREE.Group();

// BODY
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.5,0.6,2,32),
  new THREE.MeshStandardMaterial({color:0x8b0000}) // red outfit
);
group.add(body);

// HEAD
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.4,32,32),
  new THREE.MeshStandardMaterial({color:0xffe0bd})
);
head.position.y = 1.3;
group.add(head);

// HAIR (blonde + white + red streaks effect)
const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.45,32,32),
  new THREE.MeshStandardMaterial({color:0xf5deb3})
);
hair.position.y = 1.45;
group.add(hair);

// RED STREAK
const streak = new THREE.Mesh(
  new THREE.BoxGeometry(0.05,0.4,0.05),
  new THREE.MeshStandardMaterial({color:0xff0000})
);
streak.position.set(0.2,1.3,0.2);
group.add(streak);

// THIGH HIGH BOOTS
const boot1 = new THREE.Mesh(
  new THREE.CylinderGeometry(0.2,0.25,1,16),
  new THREE.MeshStandardMaterial({color:0x111111})
);
boot1.position.set(-0.2,-1,0);
group.add(boot1);

const boot2 = boot1.clone();
boot2.position.x = 0.2;
group.add(boot2);

// WINGS
const wingGeo = new THREE.PlaneGeometry(1.5,1);

const wingMat = new THREE.MeshBasicMaterial({
  color:0xffffff,
  side:THREE.DoubleSide,
  transparent:true,
  opacity:0.7
});

const wingL = new THREE.Mesh(wingGeo, wingMat);
wingL.position.set(-1,0.5,-0.5);
group.add(wingL);

const wingR = new THREE.Mesh(wingGeo, wingMat);
wingR.position.set(1,0.5,-0.5);
group.add(wingR);

// DAGGERS (energy blades)
const daggerGeo = new THREE.CylinderGeometry(0.05,0.05,1.5,16);

const daggerMat = new THREE.MeshBasicMaterial({
  color:0x00ffff
});

const dagger1 = new THREE.Mesh(daggerGeo, daggerMat);
dagger1.position.set(-0.8,0.2,0);
dagger1.rotation.z = 1.2;
group.add(dagger1);

const dagger2 = dagger1.clone();
dagger2.position.x = 0.8;
dagger2.rotation.z = -1.2;
group.add(dagger2);

scene.add(group);

// ================= ANIMATION =================
let t = 0;

function animate(){
  requestAnimationFrame(animate);

  t += 0.02;

  // wings flap
  wingL.rotation.y = Math.sin(t)*0.5;
  wingR.rotation.y = -Math.sin(t)*0.5;

  // daggers glow pulse
  dagger1.scale.y = 1 + Math.sin(t*3)*0.2;
  dagger2.scale.y = 1 + Math.sin(t*3)*0.2;

  renderer.render(scene, camera);
}
animate();

// ================= INTERACTION =================
function spin(){
  group.rotation.y += 0.5;
}

// resize
window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
