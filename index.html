<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Fantasy Lattice — Single File MMO</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #070a14, #02030a);
  color:#e6e6e6;
}

header {
  padding:14px;
  text-align:center;
  background:#0f1a33;
  border-bottom:1px solid #223;
  position:sticky;
  top:0;
}

nav a {
  color:#7cc4ff;
  margin:0 8px;
  text-decoration:none;
  font-size:14px;
}

.container {
  padding:12px;
  max-width:900px;
  margin:auto;
}

.card {
  background:#121a2e;
  border:1px solid #1f2b45;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}

input, textarea, button {
  width:100%;
  margin:6px 0;
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:14px;
}

button {
  background:#2b6cff;
  color:white;
  cursor:pointer;
}

canvas {
  width:100%;
  border:1px solid #223;
  border-radius:10px;
  background:#050816;
}

.small {
  font-size:12px;
  opacity:0.8;
}
</style>
</head>

<body>

<header>
<h2>Final Fantasy Lattice</h2>
<nav>
<a href="#hub">Hub</a>
<a href="#world">World</a>
<a href="#archive">Archive</a>
</nav>
</header>

<div class="container">

<!-- ---------------- HUB ---------------- -->
<section id="hub" class="card">
<h3>🧠 Persistent Character Core</h3>

<input id="name" placeholder="Character Name">
<button onclick="saveChar()">Save / Create Character</button>
<button onclick="loadChar()">Load Character</button>

<div id="char"></div>
</section>

<!-- ---------------- WORLD ---------------- -->
<section id="world" class="card">
<h3>🧬 Infinite Procedural Lattice World</h3>
<p class="small">
Arrow keys / swipe to move. Infinite deterministic node field.
</p>

<canvas id="c" width="360" height="220"></canvas>
</section>

<!-- ---------------- ARCHIVE ---------------- -->
<section id="archive" class="card">
<h3>📡 Lattice Archive (Local Web3-style memory)</h3>

<input id="t" placeholder="Node title">
<textarea id="d" placeholder="Node content"></textarea>
<button onclick="post()">Submit Node</button>

<div id="list"></div>
</section>

</div>

<script>

////////////////////////////////////////////////////
// 🧠 CHARACTER SYSTEM (Persistent Save)
////////////////////////////////////////////////////

function saveChar(){
  const c = {
    name: document.getElementById("name").value || "Walker_" + Math.floor(Math.random()*999),
    level: 1,
    strain: Math.floor(Math.random()*10),
    essence: Math.floor(Math.random()*100)
  };
  localStorage.setItem("ff_char", JSON.stringify(c));
  renderChar(c);
}

function loadChar(){
  const c = JSON.parse(localStorage.getItem("ff_char"));
  if(c) renderChar(c);
}

function renderChar(c){
  document.getElementById("char").innerHTML =
  `<div class="card">
    <b>${c.name}</b><br>
    Level: ${c.level}<br>
    Strain: ${c.strain}<br>
    Essence: ${c.essence}
  </div>`;
}

////////////////////////////////////////////////////
// 📡 ARCHIVE SYSTEM (Local “Web3-style” storage)
////////////////////////////////////////////////////

function post(){
  const title = document.getElementById("t").value;
  const content = document.getElementById("d").value;

  let data = JSON.parse(localStorage.getItem("ff_nodes") || "[]");
  data.push({title, content});
  localStorage.setItem("ff_nodes", JSON.stringify(data));

  renderArchive();
}

function renderArchive(){
  let data = JSON.parse(localStorage.getItem("ff_nodes") || "[]");

  let out = "";
  data.slice(-30).reverse().forEach(n=>{
    out += `
      <div class="card">
        <b>${n.title}</b><br>
        ${n.content}
      </div>
    `;
  });

  document.getElementById("list").innerHTML = out;
}

////////////////////////////////////////////////////
// 🧬 PROCEDURAL LATTICE WORLD ENGINE
////////////////////////////////////////////////////

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let player = {x:0, y:0};
let seed = 1337;

// deterministic hash → “infinite world generation”
function hash(x,y){
  let n = x*374761393 + y*668265263 + seed;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}

(() => {
  // -----------------------------
  // STATE (LOCAL STORAGE ENGINE)
  // -----------------------------
  let character = JSON.parse(localStorage.getItem("ffl_character") || "null");
  let archive = JSON.parse(localStorage.getItem("lattice_archive") || "[]");

  // -----------------------------
  // HELPERS
  // -----------------------------
  const $ = (sel) => document.querySelector(sel);

  function saveCharacter() {
    const input = document.querySelector("input");
    if (!input) return;

    character = { name: input.value || "Nameless" };
    localStorage.setItem("ffl_character", JSON.stringify(character));

    alert("Character saved: " + character.name);
  }

  function loadCharacter() {
    const data = localStorage.getItem("ffl_character");
    if (!data) return alert("No character found");

    character = JSON.parse(data);

    const input = document.querySelector("input");
    if (input) input.value = character.name;

    alert("Loaded: " + character.name);
  }

  // -----------------------------
  // ARCHIVE SYSTEM
  // -----------------------------
  function submitNode() {
    const inputs = document.querySelectorAll("input, textarea");
    const title = inputs[1]?.value || "Untitled Node";
    const content = inputs[2]?.value || "";

    if (!title.trim() || !content.trim()) {
      alert("Node incomplete");
      return;
    }

    const node = {
      title,
      content,
      time: new Date().toISOString()
    };

    archive.push(node);
    localStorage.setItem("lattice_archive", JSON.stringify(archive));

    renderArchive();

    alert("Node submitted: " + title);

    inputs[1].value = "";
    inputs[2].value = "";
  }

  function renderArchive() {
    let container = document.getElementById("archive-list");

    if (!container) {
      container = document.createElement("div");
      container.id = "archive-list";
      container.style.marginTop = "12px";
      container.style.fontSize = "14px";
      container.style.color = "#cbd5e1";

      const archiveSection = document.querySelector("textarea")?.parentElement;
      if (archiveSection) archiveSection.appendChild(container);
    }

    container.innerHTML = archive
      .slice(-10)
      .reverse()
      .map(n => `
        <div style="padding:8px;margin:6px 0;background:#1e293b;border-radius:8px">
          <b>${n.title}</b><br/>
          <small>${n.time}</small><br/>
          <div>${n.content}</div>
        </div>
      `)
      .join("");
  }

  // -----------------------------
  // EVENT WIRING (FIX MAIN ISSUE)
  // -----------------------------
  function wire() {
    const buttons = document.querySelectorAll("button");

    if (buttons[0]) buttons[0].onclick = saveCharacter;
    if (buttons[1]) buttons[1].onclick = loadCharacter;
    if (buttons[2]) buttons[2].onclick = submitNode;
  }

  // -----------------------------
  // INIT
  // -----------------------------
  function init() {
    wire();
    renderArchive();

    if (character?.name) {
      const input = document.querySelector("input");
      if (input) input.value = character.name;
    }
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
<script>
(() => {
  // =========================
  // LATTICE ENGINE v2 CORE
  // =========================

  const state = {
    character: JSON.parse(localStorage.getItem("ffl_character") || "null"),
    archive: JSON.parse(localStorage.getItem("lattice_archive") || "[]"),
    x: 0,
    y: 0
  };

  // -------------------------
  // DETERMINSITIC WORLD SEED
  // -------------------------
  function node(x, y) {
    const seed = (x * 374761393 + y * 668265263) ^ (x * y);
    return Math.abs(Math.sin(seed) * 10000) % 1;
  }

  // -------------------------
  // SAVE SYSTEM
  // -------------------------
  function saveCharacter() {
    const input = document.querySelector("input");
    if (!input) return;

    state.character = { name: input.value || "Nameless" };
    localStorage.setItem("ffl_character", JSON.stringify(state.character));

    flash("Saved: " + state.character.name);
  }

  function loadCharacter() {
    const data = localStorage.getItem("ffl_character");
    if (!data) return flash("No character");

    state.character = JSON.parse(data);

    const input = document.querySelector("input");
    if (input) input.value = state.character.name;

    flash("Loaded: " + state.character.name);
  }

  // -------------------------
  // ARCHIVE SYSTEM
  // -------------------------
  function submitNode() {
    const inputs = document.querySelectorAll("input, textarea");

    const title = inputs[1]?.value?.trim();
    const content = inputs[2]?.value?.trim();

    if (!title || !content) return flash("Incomplete node");

    const entry = {
      title,
      content,
      time: Date.now(),
      x: state.x,
      y: state.y
    };

    state.archive.push(entry);
    localStorage.setItem("lattice_archive", JSON.stringify(state.archive));

    inputs[1].value = "";
    inputs[2].value = "";

    renderArchive();
    flash("Node added: " + title);
  }

  function renderArchive() {
    let box = document.getElementById("archive-list");

    if (!box) {
      box = document.createElement("div");
      box.id = "archive-list";
      box.style.marginTop = "12px";
      box.style.color = "#cbd5e1";

      const anchor = document.querySelector("textarea")?.parentElement;
      if (anchor) anchor.appendChild(box);
    }

    box.innerHTML = state.archive.slice(-8).reverse().map(n => `
      <div style="margin:6px 0;padding:8px;background:#111827;border-radius:8px">
        <b>${n.title}</b><br/>
        <small>(${n.x}, ${n.y})</small><br/>
        <div>${n.content}</div>
      </div>
    `).join("");
  }

  // -------------------------
  // WORLD MOVEMENT (FIXES EMPTY MAP FEEL)
  // -------------------------
  function move(dx, dy) {
    state.x += dx;
    state.y += dy;
    flash(`Node: ${state.x}, ${state.y}`);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") move(0, -1);
    if (e.key === "ArrowDown") move(0, 1);
    if (e.key === "ArrowLeft") move(-1, 0);
    if (e.key === "ArrowRight") move(1, 0);
  });

  // -------------------------
  // BUTTON WIRING (CRITICAL FIX)
  // -------------------------
  function wire() {
    const buttons = document.querySelectorAll("button");

    if (buttons[0]) buttons[0].onclick = saveCharacter;
    if (buttons[1]) buttons[1].onclick = loadCharacter;
    if (buttons[2]) buttons[2].onclick = submitNode;
  }

  // -------------------------
  // UI FEEDBACK SYSTEM
  // -------------------------
  function flash(msg) {
    let el = document.getElementById("lattice-flash");

    if (!el) {
      el = document.createElement("div");
      el.id = "lattice-flash";
      el.style.position = "fixed";
      el.style.bottom = "20px";
      el.style.left = "50%";
      el.style.transform = "translateX(-50%)";
      el.style.background = "#0f172a";
      el.style.color = "#fff";
      el.style.padding = "10px 14px";
      el.style.borderRadius = "10px";
      el.style.fontSize = "13px";
      el.style.zIndex = 9999;
      document.body.appendChild(el);
    }

    el.textContent = msg;
    el.style.opacity = "1";

    setTimeout(() => {
      el.style.opacity = "0";
    }, 1200);
  }

  // -------------------------
  // INIT ENGINE
  // -------------------------
  function init() {
    wire();
    renderArchive();

    const input = document.querySelector("input");
    if (input && state.character?.name) {
      input.value = state.character.name;
    }

    flash("Lattice Engine v2 Online");
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
