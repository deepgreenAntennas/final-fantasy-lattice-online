<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Fantasy Lattice — ALTIMA</title>

<style>
body {
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#020617;
  color:#e2e8f0;
}

.container {
  padding:16px;
}

h1 {
  font-size:20px;
}

input, textarea, button {
  width:100%;
  margin:6px 0;
  padding:10px;
  border-radius:8px;
  border:none;
}

button {
  background:#6366f1;
  color:white;
  font-weight:bold;
}

canvas {
  width:100%;
  height:300px;
  border-radius:12px;
  margin-top:10px;
  background:black;
}

.archive {
  margin-top:10px;
}

.node {
  background:#0f172a;
  padding:8px;
  border-radius:8px;
  margin:6px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🧬 Final Fantasy Lattice — ALTIMA</h1>

<h3>🧠 Character Core</h3>
<input id="charName" placeholder="Enter name"/>
<button onclick="saveChar()">Save Character</button>
<button onclick="loadChar()">Load Character</button>

<h3>🌌 Infinite Lattice World</h3>
<canvas id="world"></canvas>

<h3>📡 Lattice Archive</h3>
<input id="nodeTitle" placeholder="Node title"/>
<textarea id="nodeContent" placeholder="Node memory"></textarea>
<button onclick="submitNode()">Submit Node</button>

<div id="archive"></div>

</div>

<script>
// =====================
// STATE
// =====================
let state = {
  x:0,
  y:0,
  char:null,
  archive: JSON.parse(localStorage.getItem("archive") || "[]")
};

// =====================
// CHARACTER
// =====================
function saveChar() {
  const name = document.getElementById("charName").value;
  state.char = { name };
  localStorage.setItem("char", JSON.stringify(state.char));
  flash("Saved " + name);
}

function loadChar() {
  const data = localStorage.getItem("char");
  if (!data) return flash("No save");
  state.char = JSON.parse(data);
  document.getElementById("charName").value = state.char.name;
  flash("Loaded " + state.char.name);
}

// =====================
// ARCHIVE
// =====================
function submitNode() {
  const title = document.getElementById("nodeTitle").value;
  const content = document.getElementById("nodeContent").value;

  if (!title || !content) return flash("Incomplete");

  const node = {
    title,
    content,
    x:state.x,
    y:state.y,
    time:new Date().toLocaleString()
  };

  state.archive.push(node);
  localStorage.setItem("archive", JSON.stringify(state.archive));

  renderArchive();
  flash("Node stored");

  nodeTitle.value="";
  nodeContent.value="";
}

function renderArchive() {
  const el = document.getElementById("archive");
  el.innerHTML = state.archive.slice(-10).reverse().map(n=>`
    <div class="node">
      <b>${n.title}</b><br/>
      (${n.x}, ${n.y})<br/>
      ${n.content}
    </div>
  `).join("");
}

// =====================
// WORLD ENGINE
// =====================
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 300;

function noise(x,y){
  return Math.sin(x*12.9898 + y*78.233)*43758.5453 % 1;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=-20;i<20;i++){
    for(let j=-10;j<10;j++){
      let n = noise(state.x+i, state.y+j);
      let hue = (n*360);

      ctx.fillStyle = `hsl(${hue},70%,50%)`;
      ctx.fillRect(400+i*20,150+j*20,18,18);
    }
  }

  requestAnimationFrame(draw);
}

// =====================
// MOVEMENT
// =====================
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowUp") state.y--;
  if(e.key==="ArrowDown") state.y++;
  if(e.key==="ArrowLeft") state.x--;
  if(e.key==="ArrowRight") state.x++;
});

// =====================
// TOUCH (iPhone)
// =====================
let touchStartX=0;
let touchStartY=0;

canvas.addEventListener("touchstart", e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
});

canvas.addEventListener("touchend", e=>{
  let dx=e.changedTouches[0].clientX-touchStartX;
  let dy=e.changedTouches[0].clientY-touchStartY;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0) state.x++;
    else state.x--;
  } else {
    if(dy>0) state.y++;
    else state.y--;
  }
});

// =====================
// UI FEEDBACK
// =====================
function flash(msg){
  console.log(msg);
}

// =====================
// INIT
// =====================
renderArchive();
draw();
</script>

</body>
</html>
