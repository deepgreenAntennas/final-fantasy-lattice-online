<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Fantasy Lattice — ALTIMA</title>

<style>
body {
  margin:0;
  font-family:-apple-system, sans-serif;
  background:#020617;
  color:#e2e8f0;
}

.container {
  padding:16px;
}

canvas {
  width:100%;
  height:300px;
  display:block;
  border-radius:12px;
}

input, textarea, button {
  width:100%;
  margin:6px 0;
  padding:10px;
  border-radius:8px;
  border:none;
}

button {
  background:linear-gradient(90deg,#6366f1,#8b5cf6);
  color:white;
  font-weight:bold;
}

.node {
  background:#0f172a;
  padding:8px;
  border-radius:8px;
  margin:6px 0;
}
</style>
</head>

<body>

<div class="container">

<h2>🧬 Final Fantasy Lattice — ALTIMA</h2>

<h3>🧠 Character Core</h3>
<input id="charName" placeholder="Enter name"/>
<button onclick="saveChar()">Save Character</button>
<button onclick="loadChar()">Load Character</button>

<h3>🌌 Cinematic Lattice</h3>
<canvas id="gl"></canvas>

<h3>📡 Lattice Archive</h3>
<input id="nodeTitle" placeholder="Node title"/>
<textarea id="nodeContent"></textarea>
<button onclick="submitNode()">Submit Node</button>

<div id="archive"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ================= STATE =================
let state = {
  x:0,
  y:0,
  char: JSON.parse(localStorage.getItem("char") || "null"),
  archive: JSON.parse(localStorage.getItem("archive") || "[]")
};

// ================= CHARACTER =================
function saveChar(){
  const name = charName.value;
  state.char = {name};
  localStorage.setItem("char", JSON.stringify(state.char));
  flash("Saved " + name);
}

function loadChar(){
  const data = localStorage.getItem("char");
  if(!data) return flash("No save");
  state.char = JSON.parse(data);
  charName.value = state.char.name;
  flash("Loaded " + state.char.name);
}

// ================= ARCHIVE =================
function submitNode(){
  const title = nodeTitle.value;
  const content = nodeContent.value;

  if(!title || !content) return flash("Incomplete");

  const node = {title,content,x:state.x,y:state.y};
  state.archive.push(node);
  localStorage.setItem("archive", JSON.stringify(state.archive));

  renderArchive();
  nodeTitle.value="";
  nodeContent.value="";
}

function renderArchive(){
  archive.innerHTML = state.archive.slice(-8).reverse().map(n=>`
    <div class="node">
      <b>${n.title}</b><br/>
      (${n.x}, ${n.y})<br/>
      ${n.content}
    </div>
  `).join("");
}

// ================= WEBGL =================
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({canvas});
renderer.setSize(window.innerWidth,300);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75,window.innerWidth/300,0.1,1000);
camera.position.z = 5;

const geometry = new THREE.PlaneGeometry(10,10,100,100);

const material = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    uniform float time;
    void main(){
      vUv = uv;
      vec3 pos = position;
      pos.z += sin(pos.x*4.0 + time)*0.2;
      pos.z += cos(pos.y*4.0 + time)*0.2;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float time;
    void main(){
      float c = sin(vUv.x*10.0 + time) * cos(vUv.y*10.0 + time);
      vec3 col = vec3(0.5+0.5*sin(time + vUv.x*6.0),
                      0.5+0.5*sin(time + vUv.y*6.0),
                      0.7+0.3*sin(time));
      gl_FragColor = vec4(col * c, 1.0);
    }
  `,
  wireframe:false
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// ================= LOOP =================
function animate(){
  requestAnimationFrame(animate);
  material.uniforms.time.value += 0.02;
  mesh.rotation.z += 0.001;
  renderer.render(scene,camera);
}
animate();

// ================= MOVEMENT =================
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowUp") state.y--;
  if(e.key==="ArrowDown") state.y++;
  if(e.key==="ArrowLeft") state.x--;
  if(e.key==="ArrowRight") state.x++;
});

// ================= TOUCH =================
let sx=0,sy=0;
canvas.addEventListener("touchstart", e=>{
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
});
canvas.addEventListener("touchend", e=>{
  let dx=e.changedTouches[0].clientX-sx;
  let dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)){
    dx>0?state.x++:state.x--;
  } else {
    dy>0?state.y++:state.y--;
  }
});

// ================= UI =================
function flash(msg){
  console.log(msg);
}

// INIT
renderArchive();
</script>

</body>
</html>
