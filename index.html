<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Fantasy Lattice: ALTIMA</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: monospace;
  background: black;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 10px;
}

button {
  margin: 2px;
}

#log {
  height: 120px;
  overflow-y: auto;
  font-size: 12px;
}
</style>
</head>

<body>

<div id="ui">
  <div><b>ALTIMA LATTICE SYSTEM</b></div>
  <div id="stats"></div>

  <button onclick="attack()">Attack</button>
  <button onclick="combo()">Combo</button>
  <button onclick="heal()">Heal</button>

  <br><br>
  <button onclick="saveGame()">Save</button>
  <button onclick="loadGame()">Load</button>

  <div id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
// ============================
// PLAYER SYSTEM (Player.swift)
// ============================
let player = {
  hp: 100,
  maxHp: 100,
  xp: 0,
  level: 1,
  strain: 0,
  status: []
};

// ============================
// ENEMY SYSTEM
// ============================
let enemy = {
  hp: 50
};

// ============================
// THREE.JS WORLD (PhysicsEngine)
// ============================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Player cube
const geometry = new THREE.BoxGeometry();
const material = new THREE.MeshBasicMaterial({ color: 0xff0040 });
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

// Enemy cube
const enemyGeo = new THREE.BoxGeometry();
const enemyMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
const enemyCube = new THREE.Mesh(enemyGeo, enemyMat);
enemyCube.position.x = 2;
scene.add(enemyCube);

camera.position.z = 5;

// ============================
// GAME LOOP
// ============================
function animate() {
  requestAnimationFrame(animate);

  cube.rotation.x += 0.01;
  cube.rotation.y += 0.01;

  enemyCube.rotation.y -= 0.01;

  renderer.render(scene, camera);
}
animate();

// ============================
// UI UPDATE
// ============================
function updateUI() {
  document.getElementById("stats").innerHTML =
    `HP: ${player.hp}/${player.maxHp}<br>
     XP: ${player.xp}<br>
     LVL: ${player.level}<br>
     STRAIN: ${player.strain}`;
}

// ============================
// LOG SYSTEM
// ============================
function log(msg) {
  let logBox = document.getElementById("log");
  logBox.innerHTML += msg + "<br>";
  logBox.scrollTop = logBox.scrollHeight;
}

// ============================
// COMBAT SYSTEM (skill_combos)
// ============================
function attack() {
  let dmg = Math.floor(Math.random()*10)+5;
  enemy.hp -= dmg;
  player.strain += 2;

  log("You attack for " + dmg);

  if (enemy.hp <= 0) {
    reward();
  }
  updateUI();
}

function combo() {
  let dmg = Math.floor(Math.random()*20)+10;
  enemy.hp -= dmg;
  player.strain += 5;

  log("COMBO STRIKE! " + dmg);

  if (Math.random() > 0.7) {
    applyStatus("burn");
  }

  if (enemy.hp <= 0) {
    reward();
  }
  updateUI();
}

// ============================
// STATUS EFFECT SYSTEM
// ============================
function applyStatus(type) {
  player.status.push(type);
  log("Status applied: " + type);
}

// ============================
// HEAL SYSTEM
// ============================
function heal() {
  let amount = 10;
  player.hp = Math.min(player.maxHp, player.hp + amount);
  player.strain += 1;
  log("Healed " + amount);
  updateUI();
}

// ============================
// REWARD SYSTEM
// ============================
function reward() {
  let xpGain = 20;
  player.xp += xpGain;
  log("Enemy defeated! +XP");

  if (player.xp >= 100) {
    player.level++;
    player.xp = 0;
    player.maxHp += 20;
    player.hp = player.maxHp;
    log("LEVEL UP!");
  }

  enemy.hp = 50;
}

// ============================
// ALTIMA STRAIN SYSTEM
// ============================
setInterval(() => {
  if (player.strain > 20) {
    player.hp -= 5;
    log("⚠ STRAIN DAMAGE!");
  }

  if (player.strain > 40) {
    log("⚠ REALITY DESTABILIZING...");
    cube.scale.x = Math.random()+0.5;
    cube.scale.y = Math.random()+0.5;
  }

  updateUI();
}, 2000);

// ============================
// SAVE / LOAD SYSTEM
// ============================
function saveGame() {
  localStorage.setItem("latticeSave", JSON.stringify(player));
  log("Game Saved.");
}

function loadGame() {
  let save = localStorage.getItem("latticeSave");
  if (save) {
    player = JSON.parse(save);
    log("Game Loaded.");
    updateUI();
  }
}

// ============================
// INIT
// ============================
updateUI();
</script>

</body>
</html>
